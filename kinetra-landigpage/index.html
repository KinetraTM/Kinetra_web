<!doctype html>

    <meta charset="UTF-8" />
    <script>
      // Recupera la subruta original tras el fallback 404 de GitHub Pages.
      // 404.html redirige a /<base>/?/<ruta>; el router debe ver /<base>/<ruta>.
      (function () {
        var location = window.location
        if (location.search[1] !== '/') return
        var decoded = location.search
          .slice(1)
          .split('&')
          .map(function (part) {
            return part.replace(/~and~/g, '&')
          })
          .join('?')
        window.history.replaceState(
          null,
          null,
          location.pathname.replace(/\/$/, '') + decoded + location.hash,
        )
      })()
    </script>
